name: Portfolio validation
on:
  push:
    paths:
      - "src/**"
      - "data/**"
      - ".github/workflows/portfolio-validation.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip pandas matplotlib scikit-learn openpyxl
      - name: Compile Python scripts
        run: python -m compileall -q src
      - name: Run analysis
        run: python src/analyze_sales.py
      - name: Upload generated outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-outputs
          path: outputs/
          if-no-files-found: ignore
